<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>E-CRAFT — Sasquatch Security Mission</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #071018;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-text-size-adjust: 100%;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        outline: none;
        overflow: hidden;
      }
      #app canvas {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app" tabindex="0"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('load', () => {
        const el = document.getElementById('app');
        el && el.focus();
        document.body.addEventListener('click', () => el && el.focus());
      });
    </script>
  </body>
</html>
